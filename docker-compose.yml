services:
  ptu_web_bridge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ptu_web_bridge

    # Reinicia sozinho se cair (ex: serial_bridge_node crashar) ou se o Docker
    # daemon reiniciar (ex: reboot da máquina host).
    restart: unless-stopped

    ports:
      - "8080:8080"   # interface web (pantilt_web, subida manualmente via launch)
      - "9090:9090"   # rosbridge websocket (roslib.js)
      - "8081:8081"   # web_video_server (stream de vídeo)

    volumes:
      # Workspace ROS 2 persistente, visível também no Windows via bind mount.
      - ./ros2_ws:/ros2_ws

    devices:
      # Ajuste os caminhos abaixo conforme aparecerem na sua máquina host.
      # Rode `ls /dev/ttyUSB*` no HOST (fora do container) para confirmar.
      - /dev:/dev

    environment:
      - ESP32_VID_PID=10c4:ea60

    # Necessário para acesso à porta serial da ESP32 (grupo do host pode não
    # bater 1:1 com o UID do container).
    privileged: true