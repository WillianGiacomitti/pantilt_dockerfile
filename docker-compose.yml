services:
  ptu_web_bridge:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    container_name: ptu_web_bridge

    # Reinicia sozinho se cair ou se o Docker daemon reiniciar (reboot do host).
    restart: unless-stopped

    # Rede do host: as portas 8080 (interface web, pantilt_web), 9090 (rosbridge)
    # e 8081 (web_video_server) ficam acessíveis direto em localhost, sem "ports:".
    network_mode: host

    # Mesmo UID do host: o ./ros2_ws fica com o seu dono. Os GIDs de dialout e
    # video do host permitem abrir /dev/ttyUSB* e /dev/video* sem ser root.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    group_add:
      - "${DIALOUT_GID:-20}"
      - "${VIDEO_GID:-44}"

    volumes:
      # Workspace ROS 2 persistente, visível também no host (bind mount).
      # A pasta precisa existir antes do "up" (o iniciar_ptu.sh cria), senão o
      # Docker a cria como root.
      - ./ros2_ws:/ros2_ws
      # Socket do X11, para abrir rqt/rviz na tela do host.
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

    devices:
      # Acesso à serial da ESP32 e às câmeras /dev/video*.
      - /dev:/dev

    environment:
      - ESP32_VID_PID=10c4:ea60
      - CAMERA_VID_PID=5258:4a55
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-42}
      # Perfil do Fast DDS (SHM de 10 MB). Precisa valer para TODO processo ROS
      # do container (nós, launch, ros2 CLI, daemon), por isso fica aqui e não
      # em um launch file. O arquivo vem do pantilt_ros clonado no volume.
      - FASTRTPS_DEFAULT_PROFILES_FILE=/ros2_ws/src/pantilt_ros/pantilt_bringup/config/fastdds.xml
      # GUI via X11
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1

    # O padrão do Docker (64 MB) não comporta ~10 MB de SHM por processo ROS.
    # Sem espaço, o Fast DDS volta para UDP fragmentado e as imagens perdem quadros.
    shm_size: "1gb"

    # GPU NVIDIA: ver docker-compose.gpu.yml (usado só se o host tiver GPU).

    # Mantém o acesso a /dev e a câmeras plugadas depois que o container subiu.
    privileged: true
